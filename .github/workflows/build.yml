name: Build

# Compiles the audio library and the loader with VitaSDK (softfp). It contains no game
# files: players add their own copy with "LSTCS-P_Build.bat". Pushing a tag like v1.0.0
# publishes a release with two downloads:
#   LSTCS-P.vpk  the compiled port on its own
#   LSTCS-P.zip  the PC builder that prepares the game files for the Vita

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk-softfp:latest
    steps:
      - name: Install build tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache cmake make git bash python3 zip; \
          elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y cmake make git python3 zip; fi

      - uses: actions/checkout@v4

      - name: Build OpenSL ES (LSWTCS fixes)
        working-directory: compat/opensles/libopensles
        run: |
          make LSWTCS=1 -j"$(nproc)"
          make LSWTCS=1 install

      - name: Build loader
        run: |
          cmake -S compat/loader -B build -DCMAKE_BUILD_TYPE=Release -DLSTCS_BUILD=${{ github.run_number }}
          cmake --build build -j"$(nproc)"

      - name: Package LSTCS-P.zip
        run: |
          D=dist/LSTCS-P
          mkdir -p "$D/compat"
          cp LSTCS-P_Build.bat LICENSE "$D/"
          cp "compat/HOW TO INSTALL.txt" "$D/"
          cp compat/build.ps1 compat/shaders.zip compat/config.txt "compat/HOW TO INSTALL.txt" "$D/compat/"
          (cd dist && zip -r -9 ../LSTCS-P.zip LSTCS-P)

      - uses: actions/upload-artifact@v4
        with:
          name: LSTCS-P
          path: |
            build/LSTCS-P.vpk
            LSTCS-P.zip

      # Unstripped program with debug names, needed to read Vita crash dumps
      # (psp2core-*.psp2dmp). Kept as a build artifact only, not on the release.
      - uses: actions/upload-artifact@v4
        with:
          name: LSTCS-P-debug-elf
          path: build/so_loader

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/LSTCS-P.vpk
            LSTCS-P.zip
